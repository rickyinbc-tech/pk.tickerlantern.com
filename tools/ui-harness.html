<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Poker Lantern UI tests</title></head>
<body><pre id="result">running</pre><iframe id="frame" style="width:1200px;height:900px"></iframe>
<script>
// Drives the real pages (served from public/) in an iframe and reports results for test-ui.js.
const frame=document.getElementById('frame'),results=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function load(url){return new Promise(res=>{frame.onload=()=>res(frame.contentWindow);frame.src=url})}
async function until(fn,ms=60000){const t=Date.now();while(Date.now()-t<ms){const v=fn();if(v)return v;await sleep(50)}throw Error('timeout waiting for condition')}
function check(name,cond,info=''){results.push({name,ok:!!cond,info:cond?'':String(info)})}
let w,d;const $=id=>d.getElementById(id);
const set=(id,v,ev='change')=>{$(id).value=v;$(id).dispatchEvent(new w.Event(ev,{bubbles:true}))};
const txt=id=>$(id).textContent;
let resultCount=0;const watch=()=>d.addEventListener('pokerlantern:result',()=>resultCount++);
async function page(url){w=await load(url);d=w.document;watch();await until(()=>w.Kelly&&$('kFull')&&txt('kFull'))}
// Resolves on a new result event (even when inputs are unchanged) or on a validation error.
async function analyze(){const n=resultCount;$('error').textContent='';$('calculate').click();await until(()=>resultCount>n||txt('error'));await sleep(0)}
const mode=()=>$('kSync').dataset.mode;
const handView=()=>`mode=${mode()} p=${$('kP').value} b=${$('kB').value} source=${txt('kSource')}`;
// Outcome-table helpers: rows carry data-kind / data-n; signed numbers use “−”.
const num=t=>parseFloat(String(t).replace(/−/g,'-').replace(/,/g,''));
const outRow=(kind,n)=>[...$('kOutcomes').rows].find(r=>r.dataset.kind===kind&&(n===undefined||r.dataset.n===String(n)));
const cell=(kind,i,n)=>{const r=outRow(kind,n);return r?r.cells[i].textContent:'(missing)'};
const totalProb=()=>[...$('kOutcomes').rows].find(r=>r.className==='total').cells[1].textContent;
// Caption signed numbers: [E per chip, model EV in chips, hand EV in chips]; the decision card shows the hand EV too.
const evs=()=>{const m=$('kOutcomes').caption.textContent.match(/[+−-][\d,]+(?:\.\d+)?/g)||[];return {per:num(m[0]),model:num(m[1]),hand:num(m[2]),card:num((txt('sizing').match(/[+−-][\d,]+(?:\.\d+)?/)||[])[0])}};
const evOk=()=>{const e=evs();return Math.abs(e.model-e.hand)<.011&&Math.abs(e.hand-e.card)<.011};
async function hand(h,b,pot,call,stack,extra={}){set('holeText',h);set('boardText',b);set('pot',String(pot));set('call',String(call));set('stack',String(stack));for(const [k,v] of Object.entries(extra))set(k,String(v));await analyze()}
// WCAG AA contrast audit of every visible text node (4.5:1, or 3:1 for large text), resolving stacked backgrounds.
function contrastFailures(doc){const win=doc.defaultView,parse=c=>{const m=c.match(/[\d.]+/g);return m?m.map(Number):[0,0,0,0]},lum=([r,g,b])=>{const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b)},blend=(fg,bg)=>{const a=fg[3]===undefined?1:fg[3];return [0,1,2].map(i=>fg[i]*a+bg[i]*(1-a))};
 const bgOf=el=>{const layers=[];for(let e=el;e;e=e.parentElement){const c=parse(win.getComputedStyle(e).backgroundColor);if(c.length<4||c[3]>0)layers.push(c);if(c.length<4||c[3]===1)break}let base=[255,255,255];for(const l of layers.reverse())base=blend(l,base);return base};
 const out=[];for(const el of doc.querySelectorAll('body *')){if(['SCRIPT','STYLE','OPTION'].includes(el.tagName)||el.disabled)continue;if(![...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))continue;
  const r=el.getBoundingClientRect(),cs=win.getComputedStyle(el);if(!r.width||!r.height||cs.visibility==='hidden'||el.closest('[hidden]')||(el.closest('[aria-hidden="true"]')&&!el.closest('#rangeGrid')))continue;
  const bg=bgOf(el),fg=blend(parse(cs.color),bg),L1=lum(fg),L2=lum(bg),ratio=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05),size=parseFloat(cs.fontSize),large=size>=24||(size>=18.66&&+cs.fontWeight>=700);
  if(ratio<(large?3:4.5))out.push(`${el.tagName}.${el.className} “${el.textContent.trim().slice(0,24)}” ${ratio.toFixed(2)}:1`)}
 return out}
function unnamedControls(doc){return [...doc.querySelectorAll('.setup input,.setup select,.setup button,.kelly input,.kelly button,.card-select')].filter(el=>{const r=el.getBoundingClientRect();if(!r.width||el.closest('[hidden]'))return false;
 const name=el.getAttribute('aria-label')||(el.closest('label')&&el.closest('label').textContent.trim())||(el.tagName==='BUTTON'&&el.textContent.trim());return !name}).map(el=>el.id||el.className)}

 /* ---------- Accessibility: contrast, tap targets, names; desktop and phone width ---------- */

   const tag=`${label} ${url}`,fails=contrastFailures(d);
   check(`${tag}: no WCAG AA contrast failures`,!fails.length,fails.join('; '));
   const sizes=['example','clearBoard','kUseManual'].map(id=>{const r=$(id).getBoundingClientRect();return [id,Math.round(r.width),Math.round(r.height)]});
   check(`${tag}: example, clear-board and manual buttons ≥ 44 px tall`,sizes.every(([,w,h])=>h>=44&&w>=44),JSON.stringify(sizes));
   const unnamed=unnamedControls(d);check(`${tag}: every control has an accessible name`,!unnamed.length,unnamed.join(', '));
   check(`${tag}: no horizontal scrolling`,d.documentElement.scrollWidth<=w.innerWidth,d.documentElement.scrollWidth+' > '+w.innerWidth);
  }
 }
 frame.style.width='1200px';
}
run().catch(e=>results.push({name:'harness error',ok:false,info:e.stack||String(e)})).finally(()=>{document.getElementById('result').textContent='RESULTS:'+JSON.stringify(results)});
</script></body></html>
